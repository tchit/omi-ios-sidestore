name: App iOS Omi pour SideStore

# Compile l'app iOS officielle d'Omi (github.com/BasedHardware/omi) sans signature, en mode « harness local »
# branché sur un serveur Omi personnel joignable par Tailscale. SideStore signe ensuite l'IPA avec un identifiant
# Apple gratuit (renouvellement tous les 7 jours sur l'iPhone, sans recompiler).
# Étapes reprises de app/setup.sh (« ios », flavor dev) et de leur codemagic.yaml (Flutter 3.44.5).

on:
  workflow_dispatch:
    inputs:
      team_id:
        description: "Team ID Apple (10 caractères, lu dans SideStore). Vide pour un premier essai."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-ios
  cancel-in-progress: true

env:
  OMI_COMMIT: 98bbb521b1e176a72b7844ae2e5356f989ea9fb3   # même version que le serveur
  OMI_DEV_HOST: 100.80.3.54                             # adresse Tailscale du serveur
  OMI_DEVICE_SUFFIX: sidestore
  FLUTTER_VERSION: 3.44.5

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Code d'Omi (version du serveur)
        uses: actions/checkout@v4
        with:
          repository: BasedHardware/omi
          ref: ${{ env.OMI_COMMIT }}
          path: omi
          fetch-depth: 1

      - name: Recette (ce dépôt, pour ses correctifs)
        uses: actions/checkout@v4
        with:
          path: recette
          fetch-depth: 1

      - name: Correctifs du clone (patches/app)
        working-directory: omi
        shell: bash
        run: |
          set -euo pipefail
          # 2026-10-08 : appliqués au code d'Omi intact, avant les sed de la préparation (autres fichiers). S'ils ne
          # s'appliquent plus (OMI_COMMIT changé, amont déplacé), la compilation s'arrête ici au lieu de livrer
          # une app sans eux : les refaire sur la nouvelle version.
          shopt -s nullglob
          correctifs=("$GITHUB_WORKSPACE"/recette/patches/app/*.patch)
          [ ${#correctifs[@]} -gt 0 ] || { echo "aucun correctif dans recette/patches/app" >&2; exit 1; }
          # un par un, dans l'ordre (2026-10-10) : 0009 modifie des fichiers créés par 0007 ; un seul « git apply
          # --check » de tous compare chacun au code d'origine et refuse la série
          for c in "${correctifs[@]}"; do
            git apply --check "$c"
            git apply "$c"
            echo "appliqué : ${c##*/}"
          done
          git status --short

      - name: Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Opus (comme leur intégration continue)
        run: brew install opus opus-tools

      - name: Préparation (setup.sh ios, harness local)
        working-directory: omi/app
        env:
          TEAM_ID: ${{ inputs.team_id }}
        shell: bash
        run: |
          set -euo pipefail
          source setup.sh > /dev/null
          prepare_mobile_build_env dev
          setup_firebase
          bash scripts/generate_ios_dev_info_plist.sh
          generate_ios_custom_config Dev omi-dev
          # identifiant réel de l'app compilée (configurations « -dev » du projet Xcode d'Omi) ; Firebase est
          # démarré par le code Dart avec iosBundleId (lib/firebase_options_local.dart) : les deux doivent
          # correspondre à l'identifiant final. SideStore y ajoute le Team ID de l'identifiant Apple.
          base="com.friend-app-with-wearable.ios12.development"
          final="${base}${TEAM_ID:+.${TEAM_ID}}"
          sed -i '' "s|iosBundleId: '${base}'|iosBundleId: '${final}'|g" lib/firebase_options_local.dart
          for p in ios/Runner/GoogleService-Info.plist ios/Config/Dev/GoogleService-Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :BUNDLE_ID ${final}" "$p"
          done
          echo "Identifiant Firebase : ${final}"
          grep -c "iosBundleId: '${final}'" lib/firebase_options_local.dart
          grep API_BASE_URL .dev.env

      - name: Dépendances
        working-directory: omi/app
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          cd ios && pod install --repo-update

      - name: Tests des correctifs du clone (hors appareil)
        working-directory: omi/app
        # test/plaud/ vient de patches/app ; firmware et bluetooth sont ceux d'Omi sur les fichiers touchés ; les
        # suivants viennent de 0006-0009 (discussions séparées, résumés gardés, Insights, Corriger) ou sont ceux
        # d'Omi sur l'accueil à trois onglets ; 2026-10-20 : 0011-0014 (sources des sections, nommer plusieurs
        # locuteurs, régénération fiable + MagicDNS, relecture de nuit)
        run: >-
          flutter test test/plaud/ test/unit/firmware_update_build_policy_test.dart
          test/unit/native_bluetooth_discoverer_plaud_test.dart
          test/providers/chat_history_state_test.dart test/widgets/chat_continuity_navigation_test.dart
          test/widgets/chat_discussion_switch_test.dart
          test/unit/summary_versions_test.dart test/widgets/summary_versions_tab_test.dart
          test/unit/insights_test.dart test/widgets/insights_pages_test.dart test/widgets/home_bottom_bar_test.dart
          test/unit/summary_correction_test.dart test/widgets/summary_correction_sheet_test.dart
          test/unit/insights_maintenant_bilans_test.dart test/widgets/insights_maintenant_bilans_test.dart
          test/widgets/insights_relecture_2026_10_11_test.dart
          test/unit/note_citations_test.dart test/unit/summary_section_sources_test.dart
          test/widgets/summary_section_sources_test.dart test/providers/speaker_summary_refresh_test.dart
          test/widgets/speaker_labeling_session_test.dart test/widgets/speaker_labeling_clone_test.dart
          test/unit/reprocess_reliability_test.dart test/widgets/reprocess_failure_message_test.dart
          test/unit/env_test.dart test/unit/relecture_test.dart test/widgets/relecture_test.dart
          test/unit/taches_faites_test.dart test/widgets/taches_faites_test.dart

      - name: Test de connexion vers le serveur personnel
        working-directory: omi/app
        shell: bash
        # test de connexion de l'app (toutes les 10 s) : vers le serveur personnel au lieu d'api.omi.me et de
        # Cloudflare — rien ne doit partir chez Omi. APRÈS les tests (2026-10-10) : le service lit alors Env dès sa
        # création, et les tests de widgets du chat (qui créent ConnectivityProvider sans Env.init) plantaient
        # (LateInitializationError, 25 échecs) ; l'app compilée reste identique
        run: |
          set -euo pipefail
          f=lib/services/connectivity_service.dart
          sed -i '' "s#Uri.parse('https://api.omi.me/v1/health')#Uri.parse('\${Env.apiBaseUrl}v1/health')#; s#Uri.parse('https://one.one.one.one')#Uri.parse('\${Env.apiBaseUrl}v1/health')#" "$f"
          ! grep -q "api.omi.me\|one.one.one.one" "$f"

      - name: Compilation sans signature
        working-directory: omi/app
        shell: bash
        run: |
          set -euo pipefail
          PROV="$(scripts/build_provenance_dart_defines.sh)"
          # 2026-10-21 : un numéro de build par compilation (AAMMJJHHMM, heure UTC) : avec toujours 1.0.543 (992),
          # SideStore / iOS pouvaient garder l'app déjà installée, et rien ne montrait laquelle tournait
          flutter build ios --release --no-codesign --flavor dev \
            --build-number="$(date -u +%y%m%d%H%M)" \
            --dart-define=OMI_APP_PROFILE=local_dev \
            --dart-define=OMI_API_BASE_URL=http://${OMI_DEV_HOST}:8000/ \
            --dart-define=OMI_FIREBASE_AUTH_EMULATOR_HOST=${OMI_DEV_HOST} \
            $PROV

      - name: IPA pour SideStore (sans app Apple Watch ni extensions)
        working-directory: omi/app
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/ios/iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$APP" ] || { echo "aucune app compilée"; exit 1; }
          # identifiant Apple gratuit : 3 apps et 10 identifiants par semaine ; montre, widget et extension de
          # notification en consommeraient autant
          rm -rf "$APP/PlugIns" "$APP/Watch" "$APP/Extensions"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/Omi-sidestore.ipa" Payload
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          ls -la "$GITHUB_WORKSPACE/Omi-sidestore.ipa"

      - name: Publication de l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: Omi-sidestore
          path: Omi-sidestore.ipa
          retention-days: 30
          if-no-files-found: error
